<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dung &amp; Raimond – Danke</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23E7A6AC' d='M50 88C20 65 8 48 8 32 8 18 19 10 30 10c9 0 16 5 20 12 4-7 11-12 20-12 11 0 22 8 22 22 0 16-12 33-42 56z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img src="img/floral-top.png" alt="" class="floral-band top">
  <img src="img/floral-bottom.png" alt="" class="floral-band bottom">
  <div class="floral-band side left" aria-hidden="true"><img src="img/floral-left.png" alt=""></div>
  <div class="floral-band side right" aria-hidden="true"><img src="img/floral-right.png" alt=""></div>

  <div class="gate">
    <div class="gate-card">
      <span class="eyebrow">Herzlich willkommen</span>
      <h1>Dung &amp; Raimond</h1>
      <p style="opacity:.8;">Diese Seite ist für unsere Gäste gedacht.<br>Das Passwort habt ihr über WhatsApp erhalten.</p>

      <form id="gate-form" class="gate-form" autocomplete="off">
        <label for="gate-password" class="eyebrow" style="text-align:center;">Passwort</label>
        <input
          type="password"
          id="gate-password"
          name="password"
          required
          autofocus
          placeholder="••••••••">
        <p id="gate-error" class="gate-error" role="alert" aria-live="polite"></p>
        <button type="submit" class="btn">Eintreten</button>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
